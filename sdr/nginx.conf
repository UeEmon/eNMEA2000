server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 32k;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
    location /api/ {
        proxy_pass http://nmea-router:8002;
        proxy_read_timeout 30s;
    }
    location = /health { proxy_pass http://nmea-router:8002/health; }
    location / { try_files $uri $uri/ =404; }
}
