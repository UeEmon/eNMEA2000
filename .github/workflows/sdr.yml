name: SDR receiver
on:
  push:
    branches: [main, codex/**]
    paths: ['sdr/**', '.github/workflows/sdr.yml']
  pull_request:
    paths: ['sdr/**', '.github/workflows/sdr.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  receiver:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s sdr/tests -v
      - run: python sdr/setup.py
      - run: docker compose -f sdr/compose.yaml config --quiet
      - run: docker compose -f sdr/compose.yaml -f sdr/compose.usb.yaml config --quiet
      - run: docker compose -f sdr/compose.yaml up -d --build --wait
      - run: docker compose -f sdr/compose.yaml exec -T ais-receiver AIS-catcher -L
      - run: python sdr/smoke.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix browser-tests
      - run: npx --prefix browser-tests playwright install --with-deps chromium
      - run: node sdr/browser-smoke.cjs
      - if: always()
        run: docker compose -f sdr/compose.yaml logs --tail=60
      - if: always()
        run: docker compose -f sdr/compose.yaml down
