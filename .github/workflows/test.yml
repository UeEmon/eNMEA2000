name: test
on:
  push:
    branches: [main, codex/**]
  pull_request:
    branches: [main]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: cfn-lint aws/cloudformation.json
      - run: bash -n start.sh aws/bootstrap.sh scripts/backup.sh
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/setup.py
      - run: docker compose up -d --build --wait
      - run: docker compose exec -T app python scripts/smoke.py
      - run: docker compose -f emulator/compose.yaml up -d --build --wait
      - run: python scripts/smoke_emulator.py
      - if: always()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose -f emulator/compose.yaml down
      - if: always()
        run: docker compose down
