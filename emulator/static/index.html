<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NMEA TCP Emulator</title><style>
:root{color-scheme:dark;font:15px system-ui,sans-serif;background:#0b1320;color:#e9f0f8}*{box-sizing:border-box}body{max-width:1050px;margin:0 auto;padding:28px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #304356;padding-bottom:20px;margin-bottom:28px}h1{font-size:24px;letter-spacing:.05em}h2{font-size:17px}p,small{color:#94a6bc}.badge{border:1px solid #35536a;border-radius:6px;padding:8px;color:#60ddc2}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:#142437;border:1px solid #2c4056;border-radius:12px;padding:22px}label{display:flex;justify-content:space-between;align-items:center;margin:14px 0;gap:12px}input[type=number]{width:130px;background:#0b1927;border:1px solid #41566d;border-radius:6px;padding:8px;color:white}button{background:#5fe0c4;border:0;border-radius:7px;padding:11px 18px;font-weight:600;cursor:pointer;margin-right:8px}button.stop{background:#35506a;color:#e5eff8}pre{color:#9dc7ce;overflow:auto;max-height:420px;white-space:pre-wrap;font:12px/1.7 monospace}#error{color:#ffa69c}@media(max-width:780px){.grid{grid-template-columns:1fr}}
</style></head><body><header><div><small>SEPARATE DOCKER ENVIRONMENT</small><h1>NMEA TCP Emulator</h1><p>疑似GPS・AISデータをTCPで解析システムへ送信</p></div><span id="connection" class="badge">停止中</span></header><div class="grid"><section class="card"><h2>送信設定</h2><form id="config"><label>緯度 <input id="latitude" type="number" min="-89" max="89" step="0.00001" value="35.65" required></label><label>経度 <input id="longitude" type="number" min="-180" max="180" step="0.00001" value="139.75" required></label><label>針路（度） <input id="course" type="number" min="0" max="359.99" step="0.1" value="90" required></label><label>速度（ノット） <input id="speed" type="number" min="0" max="60" step="0.1" value="12" required></label><label>送信間隔（秒） <input id="interval" type="number" min="0.2" max="60" step="0.1" value="1" required></label><label>AIS船舶数 <input id="vessel_count" type="number" min="1" max="20" step="1" value="2" required></label><label>GPS文を送る <input id="gps" type="checkbox" checked></label><label>AIS文を送る <input id="ais" type="checkbox" checked></label><button type="submit">送信開始・設定反映</button><button class="stop" id="stop" type="button">停止</button></form></section><section class="card"><h2>送信状況</h2><p>連接先：<b id="target">—</b></p><p>累計送信センテンス：<b id="lines">0</b></p><p>現在位置：<b id="position">—</b></p><p id="error"></p><h2>最新送信データ</h2><pre id="preview">送信待機中</pre></section></div><script>
const e=id=>document.getElementById(id);let timer;
async function call(path,body){const res=await fetch(path,{method:body===undefined?'GET':'POST',headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});if(!res.ok)throw Error(await res.text());return res.json()}
async function refresh(){try{const s=await call('/api/status');e('connection').textContent=s.active?(s.connected?'TCP接続中':'再接続中'):'停止中';e('target').textContent=s.target;e('lines').textContent=s.lines;e('position').textContent=s.position.lat.toFixed(5)+'°, '+s.position.lon.toFixed(5)+'°';e('preview').textContent=s.preview.join('\n')||'送信待機中';e('error').textContent=s.error}catch(err){e('error').textContent=err.message}}
e('config').onsubmit=async event=>{event.preventDefault();const data={};for(const key of ['latitude','longitude','course','speed','interval','vessel_count'])data[key]=Number(e(key).value);data.gps=e('gps').checked;data.ais=e('ais').checked;try{await call('/api/start',data);refresh()}catch(err){e('error').textContent=err.message}};
e('stop').onclick=()=>call('/api/stop',{}).then(refresh).catch(err=>e('error').textContent=err.message);refresh();timer=setInterval(refresh,1000);
</script></body></html>
