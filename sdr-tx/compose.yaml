name: nmea-sdr-tx
services:
  modulator:
    build:
      context: ..
      dockerfile: sdr-tx/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      SDR_TX_TOKEN: ${SDR_TX_TOKEN:?Run python3 sdr-tx/setup.py first}
    ports:
      - '${SDR_TX_WEB_BIND:-127.0.0.1}:18083:80'
      - '${SDR_TX_DATA_BIND:-0.0.0.0}:10113:10113/tcp'
      - '${SDR_TX_DATA_BIND:-0.0.0.0}:10113:10113/udp'
      - '${SDR_TX_DATA_BIND:-0.0.0.0}:1235:1235/tcp'
    volumes:
      - tx-data:/data
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '3'}
volumes:
  tx-data:
